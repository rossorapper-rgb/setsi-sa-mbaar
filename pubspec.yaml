name: setsi_sa_mbaar
description: Application professionnelle SET'SI SA MBAAR
publish_to: 'none'

version: 1.0.0+1

environment:
    sdk: ^3.12.2

dependencies:
    flutter:
        sdk: flutter

    flutter_localizations:
        sdk: flutter

    cupertino_icons: ^1.0.8

    # Firebase
    firebase_core: ^4.0.0
    firebase_auth: ^6.0.0
    cloud_firestore: ^6.0.0

    # Navigation
    go_router: ^16.0.0

    # Gestion d'état
    flutter_riverpod: ^2.6.1

    # Utilitaires
    intl: ^0.20.2
    uuid: ^4.5.1

    # Graphiques
    fl_chart: ^1.0.0

dev_dependencies:
    flutter_test:
        sdk: flutter

    flutter_lints: ^6.0.0

    flutter_launcher_icons: ^0.14.4

flutter:
    uses-material-design: true

    assets:
        - assets/images/